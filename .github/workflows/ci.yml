name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Cache paket Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Salin berkas environment
        run: cp .env.example .env

      - name: Install dependensi PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Periksa gaya penulisan kode
        run: vendor/bin/pint --test

  tests:
    name: Tests (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl
          coverage: none

      - name: Cache paket Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Salin berkas environment
        run: cp .env.example .env

      - name: Install dependensi PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Buat kunci aplikasi
        run: php artisan key:generate

      - name: Siapkan basis data SQLite
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Jalankan pengujian
        run: php artisan test

  frontend:
    name: Build aset frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependensi Node
        run: npm ci

      - name: Build aset produksi
        run: npm run build

      - name: Pastikan manifest terbentuk
        run: test -f public/build/manifest.json

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: hasil-build
          path: public/build
          retention-days: 7
